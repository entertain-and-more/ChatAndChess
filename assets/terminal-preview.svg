<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#2a2b3d"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Background with Drop Shadow -->
  <rect x="20" y="20" width="840" height="500" rx="12" fill="url(#bgGrad)" stroke="#313244" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header Bar -->
  <path d="M 20,32 A 12,12 0 0,1 32,20 L 848,20 A 12,12 0 0,1 860,32 L 860,58 L 20,58 Z" fill="url(#headerGrad)"/>
  <line x1="20" y1="58" x2="860" y2="58" stroke="#313244" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="44" cy="39" r="6" fill="#f38ba8"/>
  <circle cx="64" cy="39" r="6" fill="#f9e2af"/>
  <circle cx="84" cy="39" r="6" fill="#a6e3a1"/>

  <!-- Window Title -->
  <text x="440" y="43" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">ChatAndChess — Terminal Chess v1.2.0 (Minimax Engine &amp; AI Worker IPC)</text>

  <!-- Terminal Content (Monospace) -->
  <style>
    .code { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 12.5px; }
    .banner { fill: #89b4fa; font-weight: bold; }
    .muted { fill: #6c7086; }
    .accent { fill: #fab387; font-weight: bold; }
    .green { fill: #a6e3a1; font-weight: bold; }
    .cyan { fill: #94e2d5; }
    .board-edge { fill: #585b70; }
    .white-piece { fill: #cdd6f4; font-weight: bold; }
    .black-piece { fill: #f38ba8; font-weight: bold; }
    .highlight { fill: #f9e2af; font-weight: bold; }
    .prompt { fill: #a6e3a1; font-weight: bold; }
    .tag { fill: #b4befe; }
  </style>

  <!-- Left Column: Terminal Board -->
  <g class="code" transform="translate(45, 82)">
    <text y="0" class="banner">ChatAndChess [Version 1.2.0]</text>
    <text y="18" class="muted">Local-first terminal chess engine with Minimax bot, SAN &amp; PGN export</text>

    <!-- Chess Board ASCII / Unicode Grid -->
    <text y="46" class="board-edge">    a   b   c   d   e   f   g   h</text>
    <text y="62" class="board-edge">  +---+---+---+---+---+---+---+---+</text>
    <text y="78" class="board-edge">8 | <tspan class="black-piece">r</tspan> | <tspan class="black-piece">n</tspan> | <tspan class="black-piece">b</tspan> | <tspan class="black-piece">q</tspan> | <tspan class="black-piece">k</tspan> | <tspan class="black-piece">b</tspan> | <tspan class="black-piece">n</tspan> | <tspan class="black-piece">r</tspan> | 8</text>
    <text y="94" class="board-edge">  +---+---+---+---+---+---+---+---+</text>
    <text y="110" class="board-edge">7 | <tspan class="black-piece">p</tspan> | <tspan class="black-piece">p</tspan> | <tspan class="black-piece">p</tspan> | <tspan class="black-piece">p</tspan> | . | <tspan class="black-piece">p</tspan> | <tspan class="black-piece">p</tspan> | <tspan class="black-piece">p</tspan> | 7</text>
    <text y="126" class="board-edge">  +---+---+---+---+---+---+---+---+</text>
    <text y="142" class="board-edge">6 | . | . | . | . | . | . | . | . | 6</text>
    <text y="158" class="board-edge">  +---+---+---+---+---+---+---+---+</text>
    <text y="174" class="board-edge">5 | . | . | . | . | <tspan class="black-piece highlight">p</tspan> | . | . | . | 5   <tspan class="muted">[1... e7e5]</tspan></text>
    <text y="190" class="board-edge">  +---+---+---+---+---+---+---+---+</text>
    <text y="206" class="board-edge">4 | . | . | . | . | <tspan class="white-piece highlight">P</tspan> | . | . | . | 4   <tspan class="muted">[1.  e2e4]</tspan></text>
    <text y="222" class="board-edge">  +---+---+---+---+---+---+---+---+</text>
    <text y="238" class="board-edge">3 | . | . | . | . | . | <tspan class="white-piece highlight">N</tspan> | . | . | 3   <tspan class="muted">[2.  g1f3]</tspan></text>
    <text y="254" class="board-edge">  +---+---+---+---+---+---+---+---+</text>
    <text y="270" class="board-edge">2 | <tspan class="white-piece">P</tspan> | <tspan class="white-piece">P</tspan> | <tspan class="white-piece">P</tspan> | <tspan class="white-piece">P</tspan> | . | <tspan class="white-piece">P</tspan> | <tspan class="white-piece">P</tspan> | <tspan class="white-piece">P</tspan> | 2</text>
    <text y="286" class="board-edge">  +---+---+---+---+---+---+---+---+</text>
    <text y="302" class="board-edge">1 | <tspan class="white-piece">R</tspan> | <tspan class="white-piece">N</tspan> | <tspan class="white-piece">B</tspan> | <tspan class="white-piece">Q</tspan> | <tspan class="white-piece">K</tspan> | <tspan class="white-piece">B</tspan> | . | <tspan class="white-piece">R</tspan> | 1</text>
    <text y="318" class="board-edge">  +---+---+---+---+---+---+---+---+</text>
    <text y="334" class="board-edge">    a   b   c   d   e   f   g   h</text>
    <text y="356" class="muted">White: K Q R B N P  |  Black: k q r b n p</text>
  </g>

  <!-- Right Column: Status & Interactive Console -->
  <g class="code" transform="translate(450, 82)">
    <!-- Session Box -->
    <rect x="0" y="0" width="380" height="78" rx="6" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
    <text x="14" y="22" class="tag">Active Mode: <tspan class="green">vs Minimax Bot (Depth 3)</tspan></text>
    <text x="14" y="42" class="tag">Move History: <tspan class="white-piece">1. e4 e5  2. Nf3 Nc6  3. Bc4</tspan></text>
    <text x="14" y="62" class="tag">Tactical Score: <tspan class="accent">+0.38</tspan> <tspan class="muted">(advantage White)</tspan></text>

    <!-- In-game Console Commands Box -->
    <rect x="0" y="92" width="380" height="152" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
    <text x="14" y="112" class="prompt">ChatAndChess &gt; <tspan class="white-piece">hint</tspan></text>
    <text x="14" y="130" class="muted">  Analyzing position at depth 3...</text>
    <text x="14" y="148" class="cyan">  Top move: <tspan class="white-piece">f8c5 (Bc5)</tspan> eval: -0.35 [Giuoco Piano]</text>
    <text x="14" y="166" class="cyan">  Alt move: <tspan class="white-piece">g8f6 (Nf6)</tspan> eval: -0.40 [Two Knights]</text>
    <text x="14" y="192" class="prompt">ChatAndChess &gt; <tspan class="white-piece">fen</tspan></text>
    <text x="14" y="210" class="green">  r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4</text>
    <text x="14" y="232" class="prompt">ChatAndChess &gt; <tspan class="white-piece">pgn tournament_match.pgn</tspan></text>

    <!-- Capabilities Badges Footer -->
    <rect x="0" y="258" width="380" height="110" rx="6" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
    <text x="14" y="280" class="banner">Subsystem Capabilities</text>
    <text x="14" y="300" class="muted">• Zero Egress Guarantee: <tspan class="green">100% Local-First Engine</tspan></text>
    <text x="14" y="320" class="muted">• AI Agent Subprocess IPC: <tspan class="cyan">chess_comm/*.json</tspan></text>
    <text x="14" y="340" class="muted">• Headless CLI Replay: <tspan class="accent">--fen, --export-pgn, --healthcheck</tspan></text>
    <text x="14" y="358" class="muted">• Test Verification: <tspan class="green">52+ Unit &amp; Contract Tests Passed</tspan></text>
  </g>
</svg>
