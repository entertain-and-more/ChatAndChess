[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatandchess"
version = "1.2.0"
description = "Terminal chess in Python: local play, Minimax bot, Claude API mode, and Claude Code worker integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "entertain-and-more", email = "info@entertain-and-more.org" }
]
keywords = [
    "chess",
    "terminal-chess",
    "terminal-game",
    "minimax",
    "claude-api",
    "claude-code",
    "ai-chess",
    "python-chess",
    "pyside6",
    "offline-first"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games"
]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.18.0"]
gui = ["PySide6>=6.5.0"]

[project.urls]
Homepage = "https://github.com/entertain-and-more/ChatAndChess"
Documentation = "https://github.com/entertain-and-more/ChatAndChess#readme"
Repository = "https://github.com/entertain-and-more/ChatAndChess"
"Bug Tracker" = "https://github.com/entertain-and-more/ChatAndChess/issues"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
